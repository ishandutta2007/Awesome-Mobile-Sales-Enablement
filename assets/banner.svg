<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: url(#primary-grad);
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .float-orb-1 {
        animation: floatOne 10s ease-in-out infinite alternate;
      }
      .float-orb-2 {
        animation: floatTwo 8s ease-in-out infinite alternate;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: flowDash 20s linear infinite;
      }
      @keyframes flowDash {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes floatOne {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(30px, 20px) scale(1.1); }
      }
      @keyframes floatTwo {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-25px, -15px) scale(1.15); }
      }
      @keyframes pulse {
        0% { opacity: 0.3; }
        100% { opacity: 0.65; }
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />

  <!-- Dynamic Ambient Glow Orbs in Deep Background -->
  <g opacity="0.45">
    <circle class="float-orb-1" cx="150" cy="80" r="140" fill="#6366f1" filter="url(#glow)" opacity="0.3" />
    <circle class="float-orb-2" cx="1080" cy="180" r="160" fill="#0284c7" filter="url(#glow)" opacity="0.25" />
    <circle class="float-orb-1" cx="620" cy="320" r="120" fill="#a855f7" filter="url(#glow)" opacity="0.2" />
  </g>

  <!-- Animated Background Flow Grid & Wave Lines -->
  <g opacity="0.25">
    <path class="flow-line" d="M -50 180 Q 250 80, 550 200 T 1250 160" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M -50 240 Q 300 320, 650 180 T 1250 250" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <path class="flow-line" d="M -50 120 Q 350 40, 750 140 T 1250 90" fill="none" stroke="#c084fc" stroke-width="1" />
  </g>

  <!-- Dynamic Background Ambient Accent Pills / Badges (Right Flank) -->
  <g transform="translate(860, 45)" opacity="0.85">
    <!-- Dynamic Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="250" height="48" rx="24" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="26" cy="24" r="8" fill="#38bdf8" class="pulse-circle" />
      <text x="46" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📱 Mobile Offline Sync</text>
    </g>
    <!-- Dynamic Pill 2 -->
    <g transform="translate(30, 65)">
      <rect width="240" height="48" rx="24" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="26" cy="24" r="8" fill="#818cf8" class="pulse-circle" />
      <text x="46" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🤖 AI Playbook Coaching</text>
    </g>
    <!-- Dynamic Pill 3 -->
    <g transform="translate(10, 130)">
      <rect width="260" height="48" rx="24" fill="url(#card-grad)" stroke="#c084fc" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="26" cy="24" r="8" fill="#c084fc" class="pulse-circle" />
      <text x="46" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">📊 Interactive Buyer Rooms</text>
    </g>
    <!-- Dynamic Pill 4 -->
    <g transform="translate(45, 195)">
      <rect width="220" height="48" rx="24" fill="url(#card-grad)" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="26" cy="24" r="8" fill="#34d399" class="pulse-circle" />
      <text x="46" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">⚡ Field Rep Readiness</text>
    </g>
  </g>

  <!-- Foreground Main Branding Content (Unobstructed & Clean) -->
  <g transform="translate(80, 75)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 0)">
      <rect width="220" height="32" rx="16" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1" />
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8" />
      <text x="29" y="21" class="badge-text">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="85" class="title-text">Awesome Mobile Sales Enablement</text>

    <!-- Subtitle Line 1 -->
    <text x="0" y="130" class="subtitle-text">The definitive guide to mobile pitch playbooks, field rep coaching,</text>

    <!-- Subtitle Line 2 -->
    <text x="0" y="160" class="subtitle-text">digital sales rooms &amp; offline CRM stacks for GTM revenue teams.</text>

    <!-- Highlights Row -->
    <g transform="translate(0, 195)">
      <g transform="translate(0, 0)">
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">SaaS &amp; Enterprise Titans</text>
        <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Highspot • Seismic • Showpad</text>
      </g>
      <line x1="200" y1="5" x2="200" y2="40" stroke="#334155" stroke-width="1.5" />
      <g transform="translate(225, 0)">
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#818cf8">Open-Source Ecosystem</text>
        <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">Twenty • Krayin • SuiteCRM • Playcall</text>
      </g>
      <line x1="480" y1="5" x2="480" y2="40" stroke="#334155" stroke-width="1.5" />
      <g transform="translate(505, 0)">
        <text x="0" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#34d399">Platform Coverage</text>
        <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">iOS • Android • Tablets • PWA</text>
      </g>
    </g>
  </g>
</svg>
